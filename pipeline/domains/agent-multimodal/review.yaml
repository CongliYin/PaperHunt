name: Multimodal Agent Memory and Evolution
scope: >
  Image, audio, video or omni interaction is central to agent memory, harness design or evolution. Include
  audiovisual event storage and retrieval, speech-state and tool orchestration,
  streaming observation to action, and policy updates using multimodal interaction feedback.
  Include offline audiovisual memories reused by an agent and direct memory or interaction evaluations.
  ASR, codecs, image classification and low latency alone are insufficient.
  Image, speech/audio, video or omni must be central to agent memory, interaction harness or evolution. Include image-based memory, omni agent state, audio tool orchestration and video memory evaluation. Exclude robotics, embodied systems, 3D, autonomous driving and camera systems. Generic multimodal perception or generation is insufficient.
signals: [audiovisual memory, streaming video memory, voice agent, multimodal agent memory]
tags: [Audio, Video, Multimodal memory, Multimodal harness, Multimodal evolution]
