display_name: "Realtime Multimodal Agent"
description: "Scan recent arXiv papers about realtime multimodal agents: voice agents, speech tool calling, low-latency turn taking, streaming video understanding, visual grounding for tool use, proactive perception, and reusable evaluation/data/training infrastructure."
arxiv_categories:
  - "cs.AI"
  - "cs.CL"
  - "cs.CV"
  - "cs.MM"
  - "eess.AS"
output_suffix: "agent_multimodal_paper_rank"
default_top_pct: 0.5
