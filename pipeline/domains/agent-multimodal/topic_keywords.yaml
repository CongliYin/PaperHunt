# Realtime Multimodal Agent Topic Relevance - Tiered Keyword Configuration
# Tier 1 is reserved for realtime voice/video agents with tool use, low latency,
# visual grounding, proactive perception, and reusable eval/data/training loops.
# Generic VLM, ASR, TTS, or video understanding belongs in lower tiers unless it
# is explicitly connected to agent interaction or tool workflows.

