# Agent Evolution Topic Relevance - Tiered Keyword Configuration
# Scoring logic is implemented in rank_pipeline.py:
# topic_relevance = highest_tier_coefficient * 0.8 + keyword-hit bonus.
# Tier 1 is reserved for the user's target direction: production traces and
# dual-loop agent self-evolution. Broad LLM-agent papers should land in lower
# tiers unless they explicitly include evolution/training/evaluation loops.

