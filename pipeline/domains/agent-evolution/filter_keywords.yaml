# Agent Evolution gate keywords.
# The goal is to retrieve papers about agent systems that improve from traces,
# feedback, replay, skills, memory, context, simulators, verifiers, or RL loops.
# Broad "agent" hits are treated as weak signals and must co-occur with a strong
# evolution/training/evaluation signal.

