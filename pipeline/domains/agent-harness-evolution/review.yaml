name: Agent Evolution
scope: >
  Agent capabilities improve through experience, environment feedback or verification.
  Include harness, runtime, code, tool or skill evolution and parameter updates from agent
  trajectories or feedback. RSI specifically requires the mechanism generating, selecting
  or verifying future improvements to improve. Include direct evaluations of these abilities.
  Static orchestration, generic coding performance and ordinary model tuning alone are insufficient.
  Only general-purpose text/software agents. The principal contribution must change a reusable harness, skill or policy with feedback, or directly evaluate that change. Exclude training unrelated to agents, fixed evaluation-only pipelines, embodied AI, robots, 3D, world models, image, speech, video, multimodal and omni.
signals: [recursive self-improvement, self-evolving agents, harness evolution, meta-level self-modification]
tags: [Harness, Parameter learning, RSI]
