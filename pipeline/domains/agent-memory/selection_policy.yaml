priority: 40
minimum_selection_score: 7.0
minimum_llm_domain_fit: 0.70
primary_score_bonus: 3.0
standalone_signal_scope: title
required_group_scope: title

# These phrases are independently precise enough to establish that memory,
# rather than a generic Agent capability, is the paper's primary subject.
standalone_signals:
  - "agent memory"
  - "agent memories"
  - "agentic memory"
  - "agent-native memory"
  - "agent native memory"
  - "LLM agent memory"
  - "LLM agents with long-term memory"
  - "memory for LLM agents"
  - "memory for language model agents"
  - "memory system for LLM agents"
  - "memory systems for LLM agents"
  - "memory management for LLM agents"
  - "memory management of LLM agents"
  - "memory management in LLM agents"
  - "long-term agentic memory"
  - "long term agentic memory"
  - "long-term agent memory"
  - "long term agent memory"
  - "memory for personalized agents"
  - "memory for self-evolving agents"
  - "memory for self improving agents"
  - "memory layer for AI coding agents"
  - "memory layer for coding agents"
  - "memory and judgment layer for AI coding agents"
  - "verification memory for coding agents"
  - "personalized-memory benchmark for LLM agents"
  - "personalized memory benchmark for LLM agents"
  - "streaming evaluation of agent memory"

# Generic `memory` is deliberately allowed only inside a three-way title gate:
# explicit Agent ownership + memory as the subject + a concrete lifecycle,
# system, representation, or evaluation contribution.
required_groups:
  agent_context:
    - "agent"
    - "agents"
    - "agentic"
    - "LLM agent"
    - "LLM agents"
    - "language model agent"
    - "language model agents"
    - "AI agent"
    - "AI agents"
