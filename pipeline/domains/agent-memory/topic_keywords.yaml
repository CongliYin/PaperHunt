generality:
  reusable_system:
    score: 1.0
    keywords:
      - "framework"
      - "system"
      - "architecture"
      - "service"
      - "benchmark"
      - "dataset"
      - "protocol"
      - "open-source"
  multi_task:
    score: 0.8
    keywords:
      - "multiple benchmarks"
      - "across benchmarks"
      - "cross-domain"
      - "cross-model"
      - "generalization"
  narrow_application:
    score: 0.4
    keywords:
      - "case study"
      - "single domain"
      - "vertical application"

domain_penalties:
  narrow_vertical:
    multiplier: 0.75
    keywords:
      - "medical"
      - "clinical"
      - "financial advising"
      - "network operations"
      - "social simulation"
  security_first:
    multiplier: 0.2
    keywords:
      - "attack"
      - "poisoning"
      - "privacy"
      - "cryptographic"
      - "prompt injection"
