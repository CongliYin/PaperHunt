name: Agent Memory
scope: >
  Construction, storage, retrieval, consolidation, revision, forgetting, self-evolution
  or evaluation of agent experience that affects future behaviour. Include continual
  learning, parametric fast weights, non-parametric external memory and hybrid memory.
  Distinguish context length, static retrieval and memorisation of pretraining data.
signals: [agent memory, parametric memory, agentic memory, memory for agents]
tags: [Parametric memory, External memory, Hybrid memory, Continual learning, Memory evolution]
