# 反向过滤：命中以下任一词即剔除（即使命中正向词）
# 这些主要用于剔除 "3D CNN" 用于 2D 视频任务的论文
negative_strong:
  - "action recognition"
  - "video classification"
  - "video action"
  - "activity recognition"

# 反向过滤辅助：仅当通过的论文中, positive 命中的全部都来自下面这些"弱信号"，
# 而摘要里又没有任何强 3D 词（如 NeRF/Gaussian/depth/point cloud/mesh/SfM/SLAM/reconstruction/view synthesis/voxel/SDF），
# 则也剔除。这是为了防止"3D" 单字误命中 "3D-printed"、"3D CNN" 之类的非 3D 视觉论文
weak_only_positive:
  - "3D"
  - "4D"
  - "three-dimensional"

