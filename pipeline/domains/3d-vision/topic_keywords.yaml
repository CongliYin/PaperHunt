# 通用性评分（独立维度）
generality:
  broad:
    score: 0.9
    keywords:
      - "foundation model"
      - "generalizable"
      - "unified"
      - "survey"
      - "benchmark"
      - "evaluation"
      - "large-scale"
      - "million-scale"
  medium:
    score: 0.65
    keywords:
      - "reconstruction"
      - "Gaussian Splatting"
      - "novel-view synthesis"
      - "view synthesis"
      - "mesh"
      - "generation"
  narrow:
    score: 0.3
    keywords:
      - "estimation"
      - "detection"
      - "segmentation"
      - "tracking"
      - "classification"
      - "registration"
      - "localization"

# 领域降权（取最低值而非连乘）
domain_penalties:
  niche_applications:
    multiplier: 0.65
    keywords:
      - "underwater"
      - "colonoscopy"
      - "endoscopy"
      - "medical image"
      - "chest CT"
      - "ultrasound"
      - "remote sensing"
      - "agriculture"
      - "biomedical"
      - "tomography"
  traditional_perception:
    multiplier: 0.75
    keywords:
      - "object detection"
      - "anomaly segmentation"
      - "semantic segmentation"
      - "classification"
      - "tracking"
      - "registration"
      - "point cloud registration"
  single_task_estimation:
    multiplier: 0.8
    keywords:
      - "illumination estimation"
      - "pose estimation"
      - "camera localization"
      - "visual localization"
      - "low-light"
  autonomous_driving_perception:
    multiplier: 0.75
