# Agent Harness gate keywords.
# The goal is to retrieve papers about production-grade agent infrastructure:
# runtimes, harnesses, tool/skill execution, session state, context/memory,
# observability, governance, security, and platform foundations.
# Broad "agent" terms are weak signals unless paired with concrete harness,
# runtime, tool, governance, security, or production infrastructure signals.

