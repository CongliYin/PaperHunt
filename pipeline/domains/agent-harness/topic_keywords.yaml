domain_penalties:
  pure_benchmark_without_harness:
    multiplier: 0.6
    keywords:
      - "benchmark only"
      - "dataset only"
      - "leaderboard"
      - "we introduce a benchmark"
      - "we present a benchmark"
  pure_prompting_or_rag:
