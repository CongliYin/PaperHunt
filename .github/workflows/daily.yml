name: daily

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to process, YYYY-MM-DD. Empty means yesterday in RUN_TZ."
        required: false
        type: string
      domains:
        description: "Optional comma-separated domain ids"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN_TZ: Asia/Tokyo
      FIGURE_BACKEND: yolo
      STORAGE_BACKEND: blob
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL_SCORING: ${{ secrets.LLM_MODEL_SCORING }}
      LLM_MODEL_TRANSLATION: ${{ secrets.LLM_MODEL_TRANSLATION }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache DocLayout-YOLO models
        uses: actions/cache@v4
        with:
          path: |
            pipeline/models
            ~/.cache/huggingface
          key: doclayout-yolo-${{ runner.os }}-v1

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run daily pipeline
        run: |
          args=()
          if [ -n "${{ inputs.date }}" ]; then
            args+=(--date "${{ inputs.date }}")
          fi
          if [ -n "${{ inputs.domains }}" ]; then
            args+=(--domains "${{ inputs.domains }}")
          fi
          python pipeline/run_daily.py "${args[@]}"

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: update paper hunt"
          git push

