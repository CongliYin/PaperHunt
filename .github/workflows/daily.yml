name: daily

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to process, YYYY-MM-DD. Empty means RUN_DATE_OFFSET_DAYS before today in RUN_TZ, with weekend rollback enabled."
        required: false
        type: string
      domains:
        description: "Optional comma-separated domain ids"
        required: false
        type: string
      refresh_arxiv:
        description: "Refetch all required arXiv categories instead of reusing the raw metadata cache"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: paper-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN_TZ: Asia/Shanghai
      RUN_DATE_OFFSET_DAYS: "2"
      RUN_ROLLBACK_WEEKENDS: "1"
      FIGURE_BACKEND: yolo
      FIGURE_MAX_COUNT: "2"
      STORAGE_BACKEND: blob
      ARXIV_USER_AGENT: "PaperHunt/1.0 (+https://github.com/CongliYin/PaperHunt)"
      ARXIV_MAX_ATTEMPTS: "6"
      ARXIV_TIMEOUT_SECONDS: "120"
      ARXIV_429_BACKOFF_SECONDS: "60"
      ARXIV_TRANSIENT_BACKOFF_SECONDS: "30"
      ARXIV_MAX_RETRY_DELAY_SECONDS: "900"
      ARXIV_RETRY_JITTER_SECONDS: "5"
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL_SCORING: ${{ secrets.LLM_MODEL_SCORING }}
      LLM_MODEL_TRANSLATION: ${{ secrets.LLM_MODEL_TRANSLATION }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Restore raw arXiv metadata cache
        uses: actions/cache/restore@v6
        with:
          path: tmp/arxiv-raw
          key: arxiv-raw-${{ runner.os }}-legacy-submitted-date-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arxiv-raw-${{ runner.os }}-legacy-submitted-date-v1-

      - name: Cache DocLayout-YOLO models
        uses: actions/cache@v6
        with:
          path: |
            pipeline/models
            ~/.cache/huggingface
          key: doclayout-yolo-${{ runner.os }}-v1

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python pipeline/evaluate_selection_quality.py

      - name: Run daily pipeline
        run: |
          args=()
          if [ -n "${{ inputs.date }}" ]; then
            args+=(--date "${{ inputs.date }}")
          fi
          if [ -n "${{ inputs.domains }}" ]; then
            args+=(--domains "${{ inputs.domains }}")
          fi
          if [ "${{ inputs.refresh_arxiv }}" = "true" ]; then
            args+=(--refresh-arxiv)
          fi
          python pipeline/run_daily.py "${args[@]}"

      - name: Save raw arXiv metadata cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: tmp/arxiv-raw
          key: arxiv-raw-${{ runner.os }}-legacy-submitted-date-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

          git add web/public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: update paper hunt"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed, rebasing onto latest origin/${GITHUB_REF_NAME} (attempt ${attempt})..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done

          echo "Failed to push generated data after retries."
          exit 1
